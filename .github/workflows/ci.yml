name: Tests

# Publishing is handled by GitHub's built-in Pages builder, which serves the
# repository root straight from `main` (Settings → Pages → Deploy from a
# branch). The dashboard is static files with no build step, so nothing here
# needs to deploy anything — this workflow only guards the maths.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Aggregation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 71 assertions on the climatology aggregation — rate vs. total metrics,
      # leap years, partial-month guards, null-safety. No network and no
      # browser, so this stays fast and deterministic.
      #
      - run: node test/globals.mjs        # global collisions + cache-busting stamps
      - run: node test/units.mjs          # every conversion factor
      - run: node test/unit.mjs           # climatology maths
      - run: node test/build-script.mjs   # precompute + quota maths
      - run: node test/validate-script.mjs # NOAA-comparison maths
      - run: node test/stations.mjs       # station observations override the model
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Exhaustive interaction crawl
        run: node test/crawl.mjs --fast
      - name: End-to-end suite
        run: node test/e2e.mjs
      - name: Rendered-value audit
        run: node test/audit.mjs

      # Which functions did NO suite execute? A pass count says how much of
      # what a suite looked at worked; it says nothing about what it never
      # looked at. This fails if any function goes untested, which is what
      # stops the number sliding back down one exception at a time.
      - name: Coverage — every function must be executed by some test
        run: ./test/run-coverage.sh

      - name: Spot-check the committed data
        # Non-blocking here: the data can legitimately lag the code between
        # rebuilds. The climate workflow gates it properly.
        continue-on-error: true
        run: node test/spot-check.mjs
