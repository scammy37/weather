name: Rebuild climate normals

# Pulls the ERA5 history once, aggregates it, and commits data/climate.json.
#
# The dashboard used to do this in every visitor's browser, which cost roughly
# 5,500 weighted Open-Meteo calls per page load against a 5,000/hour free-tier
# cap — the page rate-limited itself. Doing it here, once a month, drops a
# visitor's cost to the live feed alone: about 5 weighted calls.
#
# The script paces its own requests from the estimated cost, so a 10-year build
# takes about half an hour and a 30-year one about ninety minutes. That is
# wall-clock time on a free runner, not effort.
#
# Runs merge into data/climate.json rather than replacing it, so building one
# period leaves the others intact.

on:
  schedule:
    # 04:00 UTC on the 3rd of each month. ERA5 lags real time by about five
    # days, so this is comfortably clear of the previous month's boundary.
    - cron: '0 4 3 * *'
  workflow_dispatch:
    inputs:
      period:
        description: 'Normals period to build ("all" for every period — several hours)'
        required: false
        default: '2016-2025'
        type: string
      home:
        description: 'Single home id (nmb, bonita, rockaway). Blank builds all three.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: climate-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit step rebases onto main, which a shallow
          # clone cannot do.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build data/climate.json
        id: build
        # Exit 2 means some sets failed but others succeeded — a partial refresh
        # is still better than none, so it is committed and flagged rather than
        # thrown away.
        run: |
          set +e
          node scripts/build-climate.mjs \
            --period "${{ inputs.period || '2016-2025' }}" \
            ${{ inputs.home && format('--home {0}', inputs.home) || '' }}
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ge 3 ] || [ "$code" -eq 1 ]; then
            echo "::error::Build failed with exit $code — nothing usable was produced."
            exit "$code"
          fi
          [ "$code" -eq 2 ] && echo "::warning::Some home/period sets failed; committing the rest."
          exit 0

      - name: Sanity-check the output
        run: |
          node -e "
            const j = require('./data/climate.json');
            const sets = Object.values(j.homes).reduce((n,h)=>n+Object.keys(h).length,0);
            if (!sets) { console.error('No home/period sets in the file.'); process.exit(1); }
            for (const [home, periods] of Object.entries(j.homes))
              for (const [p, set] of Object.entries(periods)) {
                if (set.rows.length !== 12) { console.error(home,p,'has',set.rows.length,'rows'); process.exit(1); }
                if (set.rows.some(r => r.avgHigh == null)) { console.error(home,p,'missing avgHigh'); process.exit(1); }
              }
            console.log('OK —', sets, 'home/period sets, generated', j.generated);
          "

      - name: Commit if the data changed
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage FIRST, then compare the index. `git diff` alone only looks at
          # tracked files, so on the very first run — when data/climate.json is
          # brand new and untracked — it reports "no change" and the freshly
          # built data is silently thrown away. That is exactly what happened
          # on run #2: the build succeeded, the file was written, and the job
          # went green having committed nothing.
          git add data/climate.json
          if git diff --cached --quiet -- data/climate.json; then
            echo "data/climate.json is byte-identical to what is committed — nothing to do."
            exit 0
          fi

          git commit -m "Refresh climate normals ($(date -u +%Y-%m-%d))

          Rebuilt by .github/workflows/climate.yml from the Open-Meteo ERA5
          archive. Regenerate locally with: node scripts/build-climate.mjs"

          # The build takes long enough that main can move underneath it.
          # Rebase onto whatever landed; this commit only touches a data file
          # nothing else writes, so there is nothing to conflict with.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "::error::Rebase failed — resolve by hand."; exit 1; }
            if git push origin HEAD:main; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — refetching and retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the rebuilt normals after 3 attempts."
          exit 1

      - name: Confirm the data is actually on main
        run: |
          set -euo pipefail
          git fetch origin main
          if git cat-file -e origin/main:data/climate.json 2>/dev/null; then
            size=$(git cat-file -s "$(git rev-parse origin/main:data/climate.json)")
            echo "data/climate.json is on main — $((size / 1024)) KB."
          else
            echo "::error::data/climate.json is NOT on main. The build produced data but it never landed."
            exit 1
          fi
